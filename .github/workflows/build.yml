name: Build HOANG NAM iOS
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate || echo "no xcodegen"
      - name: Build iOS app
        run: |
          rm -rf build
          xcodebuild -project HOANGNAM.xcodeproj -scheme HOANGNAM -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Package app
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r HoangNam.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: IPA
          path: HoangNam.ipa
